name: PR checks
on:
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: nomad-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Install browser test dependencies (Python 3.12 only)
        if: matrix.python == '3.12'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - run: python -m pytest
      # Explicit correctness rules: do not inherit developer-machine lint defaults.
      - if: matrix.python == '3.12'
        run: python -m ruff check --select E4,E7,E9,F .
      - if: matrix.python == '3.12'
        run: python -m build --wheel
      - name: Install wheel and smoke-test packaged entrypoint and assets
        if: matrix.python == '3.12'
        shell: bash
        run: |
          # No event inputs are interpolated into this shell script.
          checkout_dir="$PWD"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$checkout_dir"/dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I - "$checkout_dir" <<'PY'
          import json
          import os
          from importlib.metadata import distribution
          from pathlib import Path
          import sys

          import meshcore_nomad_bridge
          from meshcore_nomad_bridge.config import Settings

          checkout = Path(sys.argv[1]).resolve()
          source = Path(meshcore_nomad_bridge.__file__).resolve()
          assert source.is_relative_to(Path(sys.prefix).resolve()), source
          assert not source.is_relative_to(checkout), source
          dist = distribution("openhop-nomad-plugin")
          entry, = [ep for ep in dist.entry_points
                    if ep.group == "console_scripts" and ep.name == "meshcore-nomad-bridge"]
          assert entry.value == "meshcore_nomad_bridge.main:main"
          assert callable(entry.load())  # Import only: never start the bridge or radio.
          assert os.access(Path(sys.prefix) / "bin" / entry.name, os.X_OK)
          assets = Path(sys.prefix) / "share/openhop/plugins/openhop.nomad"
          manifest = json.loads((assets / "openhop-plugin.json").read_text())
          config_path = assets / "config.default.json"
          defaults = json.loads(config_path.read_text())
          assert manifest["id"] == "openhop.nomad"
          assert manifest["version"] == dist.version
          assert manifest["runtime"]["entrypoint"] == entry.name
          assert manifest["config"]["defaults"] == defaults
          for relative in ("openhop-plugin.json", "config.default.json",
                           "ui/index.html", "ui/app.js", "ui/styles.css"):
              assert (assets / relative).read_bytes() == (checkout / relative).read_bytes()
          assert (assets / manifest["ui"]["entry"]).is_file()
          data_dir = Path.cwd() / "plugin-data"
          data_dir.mkdir()
          (data_dir / "config.json").write_bytes(config_path.read_bytes())
          os.environ.clear()
          os.environ["OPENHOP_PLUGIN_DATA"] = str(data_dir)
          settings = Settings.from_env()
          assert settings.nomad_url == "http://nomad_admin:8080"
          assert (settings.meshcore_host, settings.meshcore_port) == ("127.0.0.1", 5050)
          assert settings.one_shot is False
          assert settings.allowed_sender_prefixes == ()
          print(f"Installed wheel {dist.version}: entrypoint, defaults and UI assets OK ({source})")
          PY
