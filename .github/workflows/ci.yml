name: PR checks
on:
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: nomad-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      # Explicit correctness rules: do not inherit developer-machine lint defaults.
      - run: python -m ruff check --select E4,E7,E9,F .
      - run: python -m build --wheel
