name: Build Wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing tag/release to upload assets to"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Create zipped wheel bundle
        shell: bash
        run: |
          mkdir -p release-assets
          tag_name="${GITHUB_REF_NAME:-manual}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            tag_name="${{ inputs.release_tag }}"
          fi
          zip_name="openhop-nomad-plugin-${tag_name}-wheel.zip"
          (
            cd dist
            zip -j "../release-assets/${zip_name}" *.whl
          )
          echo "WHEEL_ZIP=release-assets/${zip_name}" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhop-nomad-plugin-wheel
          path: |
            dist/*.whl
            ${{ env.WHEEL_ZIP }}

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
          files: |
            dist/*.whl
            ${{ env.WHEEL_ZIP }}
