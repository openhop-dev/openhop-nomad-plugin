[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-nomad-plugin"
version = "0.1.0"
description = "openHop service plugin bridging a MeshCore Companion identity to Project N.O.M.A.D."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenHop Community" }
]
dependencies = [
  "openhop_core @ git+https://github.com/openhop-dev/openhop_core.git@dev"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.scripts]
meshcore-nomad-bridge = "meshcore_nomad_bridge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshcore_nomad_bridge*"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.nomad" = ["openhop-plugin.json", "config.default.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
